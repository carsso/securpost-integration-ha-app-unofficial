name: Validate

on:
  # Branch-filtered so a release's tag push doesn't re-validate the identical
  # tree the preceding commit push already covered.
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # Permanent: home-assistant/brands no longer accepts custom-integration
          # icons (2026.3). Brands ship from custom_components/securpost_app/brand/.
          ignore: brands

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
